<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>תשלום | GINO VINO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.css"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="mobile.css" media="screen and (max-width: 768px)">
  <style>
    :root {
      --bg: #080604; --bg2: #0e0b07; --bg3: #161209; --bg4: #1d1810;
      --gold: #c9a84c; --gold2: #e0c06a; --text: #e4d8c0; --text2: #9a8868;
      --border: rgba(201,168,76,0.15); --red: #c0392b; --green: #27ae60;
      --r: 10px; --r2: 16px; --t: 0.32s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Assistant', sans-serif; direction: rtl; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    
    /* Header */
    .hdr { padding: 16px 32px; background: rgba(8,6,4,0.92); border-bottom: 1px solid var(--border); text-align: center; }
    .hdr-logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; color: var(--gold); }
    
    /* Layout */
    .checkout-wrap { max-width: 900px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }
    .step-container { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r2); padding: 32px; display: none; animation: fadeIn 0.4s ease; }
    .step-container.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    h2 { font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 24px; text-align: center; }
    
    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.9rem; color: var(--text2); }
    .form-group input, .form-group textarea { background: var(--bg4); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: var(--r); font-family: inherit; font-size: 1rem; outline: none; transition: all var(--t); }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--gold); }
    
    /* Summary inside Form */
    .summary-box { background: var(--bg4); border: 1px solid var(--border); padding: 20px; border-radius: var(--r); margin-bottom: 24px; }
    .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
    .summary-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .summary-total { font-size: 1.2rem; font-weight: 800; color: var(--gold); margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; display: flex; justify-content: space-between;}
    
    /* Buttons */
    .btn-primary { width: 100%; background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; border: none; padding: 16px; border-radius: 50px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all var(--t); box-shadow: 0 6px 24px rgba(201,168,76,0.2); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(201,168,76,0.4); }
    
    /* Loading Spinner */
    .spinner { border: 4px solid var(--border); border-top: 4px solid var(--gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* Invoice Styling */
    #invoiceNode { background: #fff; color: #000; padding: 40px; border-radius: 8px; width: 100%; max-width: 500px; margin: 0 auto 24px; direction: rtl; text-align: center; }
    .inv-logo { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: #000; margin-bottom: 10px; }
    .inv-title { font-size: 1.2rem; margin-bottom: 20px; font-weight: 700; }
    .inv-details { text-align: right; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.5; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .inv-table th, .inv-table td { text-align: right; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .inv-table th { font-weight: 700; }
    .inv-total { text-align: left; font-size: 1.3rem; font-weight: 800; margin-top: 10px; }
    .inv-footer { margin-top: 30px; font-size: 0.8rem; color: #666; }

    @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    /* ══════════════════════════════════════════
   קובץ התאמות למובייל וטאבלטים (עד 768 פיקסלים)
══════════════════════════════════════════ */

@media (max-width: 768px) {
  
  /* התאמת התפריט העליון */
  .hdr {
    padding: 0 16px;
  }
  
  /* הסתרת הקישורים הרגילים והצגת כפתור ההמבורגר */
  .hdr-nav {
    display: none;
  }
  .hmbgr {
    display: flex;
  }

  /* כותרת המסך הראשי קטנה יותר */
  .hero-title {
    font-size: 2.5rem;
  }

  /* הפיכת גריד התמונות ל-2 עמודות במקום 4 */
  .gallery-grid {
    grid-template-columns: 1fr 1fr;
  }
  
  /* וכן הלאה - כל השינויים לפלאפון נכנסים כאן... */

}

/* אפשר גם לעשות התאמה ספציפית למסכים ממש קטנים (פלאפונים קטנים) */
@media (max-width: 480px) {
  .products-grid {
    grid-template-columns: 1fr; /* מוצר אחד בשורה */
  }
}
  </style>
</head>
<body>

<header class="hdr">
  <a href="index.html" class="hdr-logo"><i class="fas fa-wine-bottle"></i>GINO VINO</a>
</header>

<div class="checkout-wrap">
  
  <div class="step-container active" id="stepDetails">
    <h2>השלמת הזמנה</h2>
    
    <div class="summary-box" id="checkoutSummary">
      </div>

    <form id="detailsForm">
      <div class="form-grid">
        <div class="form-group"><label>שם מלא</label><input type="text" id="cName" required></div>
        <div class="form-group"><label>טלפון נייד</label><input type="tel" id="cPhone" required></div>
        <div class="form-group"><label>עיר</label><input type="text" id="cCity" required></div>
        <div class="form-group"><label>רחוב ומספר בית</label><input type="text" id="cAddress" required></div>
        <div class="form-group full"><label>הערות לשליח (אופציונלי)</label><textarea id="cNotes" rows="2"></textarea></div>
      </div>
      <button type="submit" class="btn-primary"><i class="fas fa-credit-card" style="margin-left:8px"></i>המשך לתשלום</button>
    </form>
  </div>

  <div class="step-container" id="stepPayment" style="text-align:center; padding: 60px 20px;">
    <div class="spinner"></div>
    <h3 style="color:var(--gold); margin-bottom:10px;">מתחבר למערכת סליקה...</h3>
    <p style="color:var(--text2)">אנא המתן, מעבד את התשלום המאובטח.</p>
  </div>

  <div class="step-container" id="stepInvoice">
    <h2>ההזמנה בוצעה בהצלחה!</h2>
    <p style="text-align:center; color:var(--text2); margin-bottom:24px;">תודה שקנית ב-GINO VINO. הקבלה שלך מוכנה.</p>
    
    <div id="invoiceNode">
      <div class="inv-logo">GINO VINO</div>
      <div class="inv-title">קבלה / פירוט הזמנה</div>
      <div class="inv-details" id="invCustomerDetails"></div>
      <table class="inv-table">
        <thead><tr><th>פריט</th><th>כמות</th><th style="text-align:left">מחיר</th></tr></thead>
        <tbody id="invItems"></tbody>
      </table>
      <div class="inv-total" id="invTotal"></div>
      <div class="inv-footer">תודה על קנייתך! | GINO VINO | שתו באחריות</div>
    </div>

    <button class="btn-primary" onclick="generateAndSend()"><i class="fab fa-whatsapp" style="margin-left:8px"></i>הורד קבלה ושלח לוואטסאפ</button>
    <div style="text-align:center; margin-top:20px;">
      <a href="index.html" style="color:var(--text2); text-decoration:underline;">חזרה לדף הבית</a>
    </div>
  </div>

</div>

<script>
  let cart = [];
  let deliveryMethod = 'pickup';
  let discount = 0;
  let finalTotal = 0;
  let orderData = {};

  // 1. Load Data on Start
  window.onload = () => {
    try {
      cart = JSON.parse(localStorage.getItem('ginoCart') || '[]');
      deliveryMethod = localStorage.getItem('ginoDelivery') || 'pickup';
      discount = parseInt(localStorage.getItem('ginoDiscount') || '0');
    } catch(e) {}

    if(cart.length === 0) {
      alert("העגלה ריקה. מועבר חזרה לחנות.");
      window.location.href = "shop.html";
      return;
    }
    renderSummary();
  };

  // 2. Render Order Summary
  function renderSummary() {
    const sumBox = document.getElementById('checkoutSummary');
    let sub = 0;
    
    let html = '';
    cart.forEach(item => {
      let lineTotal = parseFloat(item.price) * parseInt(item.qty);
      sub += lineTotal;
      html += `<div class="summary-item"><span>${item.qty} x ${item.name}</span><span>${lineTotal} ₪</span></div>`;
    });

    const delivCost = (deliveryMethod === 'delivery') ? 30 : 0;
    const discVal = Math.round(sub * discount / 100);
    finalTotal = sub - discVal + delivCost;

    if(discVal > 0) html += `<div class="summary-item" style="color:var(--green)"><span>הנחה (${discount}%)</span><span>-${discVal} ₪</span></div>`;
    html += `<div class="summary-item"><span>${deliveryMethod === 'delivery' ? 'משלוח' : 'איסוף עצמי'}</span><span>${delivCost > 0 ? delivCost+' ₪' : 'חינם'}</span></div>`;
    html += `<div class="summary-total"><span>סה"כ לתשלום</span><span>${finalTotal} ₪</span></div>`;
    
    sumBox.innerHTML = html;
  }

  // 3. Handle Form Submit -> Payment
  document.getElementById('detailsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    
    // Save Customer Data
    orderData = {
      name: document.getElementById('cName').value,
      phone: document.getElementById('cPhone').value,
      city: document.getElementById('cCity').value,
      address: document.getElementById('cAddress').value,
      notes: document.getElementById('cNotes').value,
      date: new Date().toLocaleString('he-IL')
    };

    // Show Payment Step (Simulation)
    document.getElementById('stepDetails').classList.remove('active');
    document.getElementById('stepPayment').classList.add('active');

    // Simulate Payment Gateway delay (e.g. 2.5 seconds)
    setTimeout(() => {
      buildInvoice();
      document.getElementById('stepPayment').classList.remove('active');
      document.getElementById('stepInvoice').classList.add('active');
      
      // Clear cart after successful order
      localStorage.removeItem('ginoCart');
    }, 2500);
  });

  // 4. Build the HTML Invoice
  function buildInvoice() {
    const detailsDiv = document.getElementById('invCustomerDetails');
    detailsDiv.innerHTML = `
      <strong>שם:</strong> ${orderData.name}<br>
      <strong>טלפון:</strong> ${orderData.phone}<br>
      <strong>כתובת:</strong> ${orderData.address}, ${orderData.city}<br>
      <strong>תאריך:</strong> ${orderData.date}<br>
      <strong>סוג הזמנה:</strong> ${deliveryMethod === 'delivery' ? 'משלוח' : 'איסוף עצמי'}
    `;

    const itemsTbody = document.getElementById('invItems');
    let html = '';
    cart.forEach(item => {
      let lineTotal = parseFloat(item.price) * parseInt(item.qty);
      html += `<tr><td>${item.name}</td><td>${item.qty}</td><td style="text-align:left">${lineTotal} ₪</td></tr>`;
    });
    
    // Add delivery row if needed
    if(deliveryMethod === 'delivery') {
      html += `<tr><td>דמי משלוח</td><td>1</td><td style="text-align:left">30 ₪</td></tr>`;
    }
    itemsTbody.innerHTML = html;
    
    document.getElementById('invTotal').innerHTML = `סה"כ שולם: ${finalTotal} ₪`;
  }

  // 5. Generate Image and Send WhatsApp
  function generateAndSend() {
    const invoiceNode = document.getElementById('invoiceNode');
    
    // Step A: Convert Invoice to Canvas/Image
    html2canvas(invoiceNode, { scale: 2 }).then(canvas => {
      // Create download link for the image
      const link = document.createElement('a');
      link.download = `GINO_VINO_Order_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click(); // Auto-download to user's device

      // Step B: Prepare WhatsApp Text Message
      let text = `*הזמנה חדשה - GINO VINO* 🍷\n\n`;
      text += `*שם:* ${orderData.name}\n`;
      text += `*טלפון:* ${orderData.phone}\n`;
      text += `*כתובת:* ${orderData.address}, ${orderData.city}\n`;
      if(orderData.notes) text += `*הערות:* ${orderData.notes}\n`;
      text += `*משלוח/איסוף:* ${deliveryMethod === 'delivery' ? 'משלוח (30 ₪)' : 'איסוף עצמי'}\n\n`;
      
      text += `*פירוט מוצרים:*\n`;
      cart.forEach(item => {
        text += `- ${item.qty} x ${item.name}\n`;
      });
      
      text += `\n*סה"כ לתשלום:* ${finalTotal} ₪\n`;
      text += `(הקבלה ירדה למכשיר של הלקוח)`;

      // Step C: Redirect to WhatsApp
      const waNumber = '9720536210899'; // המספר של GINO VINO
      const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(text)}`;
      
      // Open WA after a short delay so the download triggers safely
      setTimeout(() => {
        window.open(waUrl, '_blank');
      }, 500);
    });
  }
</script>

</body>
</html>
